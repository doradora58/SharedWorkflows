name: Shared Build and Push Pipeline

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      host-port:
        required: true
        type: string
    secrets:
      registry-host:
        required: true

jobs:
  build:
    runs-on: self-hosted
    outputs:
      version: ${{ steps.prep.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Version Tag
        id: prep
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION="1.0.0-$(date +'%Y%m%d%H%M%S')-${SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          SERVICE="${{ inputs.service-name }}"
          
          # ビルド時はサービス名（ローカル名）だけでタグ付け
          docker build -t ${SERVICE}:latest \
                       -t ${SERVICE}:${VERSION} .

  publish:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Version Tag
        id: prep
        run: |
          SHA=$(git rev-parse --short HEAD)
          VERSION="1.0.0-$(date +'%Y%m%d%H%M%S')-${SHA}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Tag and Push Docker Image
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          SERVICE="${{ inputs.service-name }}"
          REGISTRY="${{ secrets.registry-host }}"
          
          # ローカルのイメージにレジストリ用のタグを付与してプッシュ
          docker tag ${SERVICE}:latest ${REGISTRY}/${SERVICE}:latest
          docker tag ${SERVICE}:${VERSION} ${REGISTRY}/${SERVICE}:${VERSION}
          
          docker push ${REGISTRY}/${SERVICE}:latest
          docker push ${REGISTRY}/${SERVICE}:${VERSION}